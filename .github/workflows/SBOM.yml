# file: .github/workflows/SBOM.yml
# purpose: generate the SPDX SBOM with tools/generate_sbom.jl on every
#          published release and attach it as a release asset
#          (Sparlectra-<tag>.spdx.json). A manual workflow_dispatch run has
#          no release context and uploads the SBOM as a workflow artifact
#          instead. If the license scan fails, the job retries once with
#          SPARLECTRA_SBOM_NO_LICENSESCAN=1 and says so in the step log.
#          The SBOM is intentionally NOT checked into the repository.
name: SBOM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Determine SBOM file name
        id: sbomname
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "file=Sparlectra-${{ github.event.release.tag_name }}.spdx.json" >> "$GITHUB_OUTPUT"
          else
            echo "file=Sparlectra.spdx.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate SBOM
        run: |
          if ! julia tools/generate_sbom.jl "${{ steps.sbomname.outputs.file }}"; then
            echo "license scan failed; retrying once with SPARLECTRA_SBOM_NO_LICENSESCAN=1"
            SPARLECTRA_SBOM_NO_LICENSESCAN=1 julia tools/generate_sbom.jl "${{ steps.sbomname.outputs.file }}"
          fi
      - name: Upload as release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.sbomname.outputs.file }}"
      - name: Upload as workflow artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: ${{ steps.sbomname.outputs.file }}
