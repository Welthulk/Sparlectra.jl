name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

# contents: write — the build job pushes regenerated Literate artifacts
# (notebooks/, docs/src/generated/) back to the branch when they are stale.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - name: Cache Julia packages
        uses: julia-actions/cache@v3

      - name: Resolve and instantiate docs environment
        run: |
          julia --project=docs -e '
            using Pkg

            registries = Pkg.Registry.reachable_registries()
            has_general = any(reg -> reg.name == "General", registries)

            if !has_general
                Pkg.Registry.add(Pkg.RegistrySpec(
                    name = "General",
                    url = "https://github.com/JuliaRegistries/General.git",
                ))
            end

            Pkg.resolve()
            Pkg.instantiate()
            Pkg.precompile()
          '

      # Regenerate the Literate outputs (Documenter page + Colab notebook)
      # BEFORE the docs build, so the deployed page is always fresh even if a
      # contributor edited docs/lit/*.jl without regenerating locally.
      - name: Regenerate Literate outputs
        run: julia --project=docs docs/generate_notebooks.jl

      # Colab loads notebooks/*.ipynb from the repository itself, so stale
      # committed artifacts must be pushed back, not just rebuilt. Loop-safe:
      # pushes made with GITHUB_TOKEN do not retrigger workflows, and a rerun
      # would find no diff anyway.
      - name: Commit regenerated Literate artifacts
        run: |
          git add notebooks docs/src/generated
          if git diff --cached --quiet; then
            echo "Literate artifacts are up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate Literate artifacts (docs page + notebook)"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Build documentation
        run: julia --project=docs docs/make.jl

      - name: Copy documentation build to Pages artifact directory
        run: |
          mkdir -p _site
          cp -r docs/build/* _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
