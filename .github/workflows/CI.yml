name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # Cache the MATPOWER case files the test suite fetches on demand.
      # raw.githubusercontent.com rate-limits shared runner IPs, which made
      # runs fail transiently; after one populated run the tests no longer
      # download at all. Saved via cache/save with always() so a red test
      # step still keeps successfully downloaded cases for the next run.
      # The key hashes the test sources: when tests start using additional
      # cases, a new cache is saved, seeded from the previous one via the
      # restore-keys prefix match.
      - uses: actions/cache/restore@v4
        id: matpower-cases
        with:
          path: data/mpower
          key: matpower-cases-${{ hashFiles('test/**') }}
          restore-keys: |
            matpower-cases-
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: actions/cache/save@v4
        if: always() && steps.matpower-cases.outputs.cache-hit != 'true'
        with:
          path: data/mpower
          key: matpower-cases-${{ hashFiles('test/**') }}